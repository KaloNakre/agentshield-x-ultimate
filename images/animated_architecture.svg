<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="400">
  <defs>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Moving dots along path -->
    <style>
      .moving-packet {
        stroke-dasharray: 10 20;
        animation: dash 2s linear infinite;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -30;
        }
      }
      .box { fill: #1a1a2e; stroke: #0f3460; stroke-width: 3; rx: 10; }
      .box-text { fill: #e94560; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .box-subtext { fill: #a5a5b0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 12px; text-anchor: middle; }
      .line { stroke: #0f3460; stroke-width: 3; fill: none; }
      .packet-line { stroke: #00ffcc; stroke-width: 4; fill: none; filter: url(#glow); }
      .bg { fill: #0d0d1a; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Nodes -->
  <!-- User PC / University Lab -->
  <rect x="50" y="150" width="120" height="80" class="box" />
  <text x="110" y="190" class="box-text">University PC</text>
  <text x="110" y="210" class="box-subtext">(Client Lab)</text>

  <!-- Rust Firewall Gateway -->
  <rect x="250" y="150" width="140" height="80" class="box" />
  <text x="320" y="190" class="box-text">Rust Firewall</text>
  <text x="320" y="210" class="box-subtext">(API Gateway)</text>

  <!-- WAF Engine -->
  <rect x="470" y="70" width="140" height="80" class="box" />
  <text x="540" y="110" class="box-text">WAF Engine</text>
  <text x="540" y="130" class="box-subtext">(OWASP CRS)</text>

  <!-- AI Hybrid Transformer -->
  <rect x="470" y="230" width="140" height="80" class="box" />
  <text x="540" y="270" class="box-text">AI Security</text>
  <text x="540" y="290" class="box-subtext">(Hybrid Transformer)</text>

  <!-- Target Server / Application -->
  <rect x="680" y="150" width="100" height="80" class="box" />
  <text x="730" y="190" class="box-text">Target App</text>
  <text x="730" y="210" class="box-subtext">(Protected)</text>

  <!-- Paths -->
  <!-- PC to Firewall -->
  <path id="path1" class="line" d="M 170 190 L 250 190" />
  <path class="packet-line moving-packet" d="M 170 190 L 250 190" />

  <!-- Firewall to WAF -->
  <path id="path2" class="line" d="M 390 170 C 420 170 430 110 470 110" />
  <path class="packet-line moving-packet" d="M 390 170 C 420 170 430 110 470 110" />

  <!-- Firewall to AI -->
  <path id="path3" class="line" d="M 390 210 C 420 210 430 270 470 270" />
  <path class="packet-line moving-packet" d="M 390 210 C 420 210 430 270 470 270" />

  <!-- WAF to Target -->
  <path id="path4" class="line" d="M 610 110 C 650 110 650 170 680 170" />
  <path class="packet-line moving-packet" d="M 610 110 C 650 110 650 170 680 170" />

  <!-- AI to Target -->
  <path id="path5" class="line" d="M 610 270 C 650 270 650 210 680 210" />
  <path class="packet-line moving-packet" d="M 610 270 C 650 270 650 210 680 210" />

</svg>
