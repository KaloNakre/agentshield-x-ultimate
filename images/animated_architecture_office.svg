<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="400">
  <defs>
    <!-- Glow filter -->
    <filter id="glow-office" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Moving dots along path -->
    <style>
      .moving-packet-office {
        stroke-dasharray: 10 20;
        animation: dash-office 2s linear infinite;
      }
      @keyframes dash-office {
        to {
          stroke-dashoffset: -30;
        }
      }
      .box-office { fill: #1a1a2e; stroke: #ff8c00; stroke-width: 3; rx: 10; }
      .box-text-office { fill: #f0f0f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .box-subtext-office { fill: #a5a5b0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 12px; text-anchor: middle; }
      .line-office { stroke: #ff8c00; stroke-width: 3; fill: none; }
      .packet-line-office { stroke: #ff00ff; stroke-width: 4; fill: none; filter: url(#glow-office); }
      .bg-office { fill: #0d0d1a; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg-office" />

  <!-- Nodes -->
  <!-- Corporate Office PC -->
  <rect x="50" y="150" width="120" height="80" class="box-office" />
  <text x="110" y="190" class="box-text-office">Corporate PC</text>
  <text x="110" y="210" class="box-subtext-office">(Branch Office)</text>

  <!-- Rust Firewall Gateway -->
  <rect x="250" y="150" width="140" height="80" class="box-office" />
  <text x="320" y="190" class="box-text-office">Rust Firewall</text>
  <text x="320" y="210" class="box-subtext-office">(Edge Proxy)</text>

  <!-- WAF Engine -->
  <rect x="470" y="70" width="140" height="80" class="box-office" />
  <text x="540" y="110" class="box-text-office">WAF Engine</text>
  <text x="540" y="130" class="box-subtext-office">(Zero Trust)</text>

  <!-- AI Hybrid Transformer -->
  <rect x="470" y="230" width="140" height="80" class="box-office" />
  <text x="540" y="270" class="box-text-office">AI Security</text>
  <text x="540" y="290" class="box-subtext-office">(DLP & Threat Intel)</text>

  <!-- Target Server / Application -->
  <rect x="680" y="150" width="100" height="80" class="box-office" />
  <text x="730" y="190" class="box-text-office">Internal App</text>
  <text x="730" y="210" class="box-subtext-office">(Protected HR)</text>

  <!-- Paths -->
  <!-- PC to Firewall -->
  <path id="path1-office" class="line-office" d="M 170 190 L 250 190" />
  <path class="packet-line-office moving-packet-office" d="M 170 190 L 250 190" />

  <!-- Firewall to WAF -->
  <path id="path2-office" class="line-office" d="M 390 170 C 420 170 430 110 470 110" />
  <path class="packet-line-office moving-packet-office" d="M 390 170 C 420 170 430 110 470 110" />

  <!-- Firewall to AI -->
  <path id="path3-office" class="line-office" d="M 390 210 C 420 210 430 270 470 270" />
  <path class="packet-line-office moving-packet-office" d="M 390 210 C 420 210 430 270 470 270" />

  <!-- WAF to Target -->
  <path id="path4-office" class="line-office" d="M 610 110 C 650 110 650 170 680 170" />
  <path class="packet-line-office moving-packet-office" d="M 610 110 C 650 110 650 170 680 170" />

  <!-- AI to Target -->
  <path id="path5-office" class="line-office" d="M 610 270 C 650 270 650 210 680 210" />
  <path class="packet-line-office moving-packet-office" d="M 610 270 C 650 270 650 210 680 210" />

</svg>
